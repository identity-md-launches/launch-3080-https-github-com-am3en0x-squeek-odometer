[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
no_match_path = "test/fork/*"

[profile.default.fuzz]
runs = 512
seed = "0x85fa591383f4e7b776f91b5633053b3d8132526e6370e1e924ac214f2266ba93"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 120

# Against Sepolia: forge test --profile fork (needs an RPC that serves historical state)
[profile.fork]
match_path = "test/fork/*"
no_match_path = "test/mocks/*"

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"

